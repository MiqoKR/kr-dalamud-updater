name: Release KR Dalamud Updater

on:
  push:
    tags:
      - "updater-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the updater-v prefix (example: 0.4.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve release version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}" -replace '^updater-v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid release version: $version"
          }
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build release assets
        shell: pwsh
        run: >-
          ./tools/Build-GitHubUpdaterRelease.ps1
          -Version $env:RELEASE_VERSION
          -Repository "${{ github.repository }}"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "updater-v$env:RELEASE_VERSION"
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
          }
          gh release create $tag `
            "dist/github-release/KR-Dalamud-Updater-$env:RELEASE_VERSION-Portable.zip" `
            "dist/github-release/KR-Dalamud-Updater-Payload.zip" `
            --title "KR Dalamud Updater $env:RELEASE_VERSION" `
            --generate-notes `
            --verify-tag
